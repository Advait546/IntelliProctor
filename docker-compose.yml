# Optional infrastructure for the full target stack (BACKEND_ARCHITECTURE.md 20.1).
# The backend runs without any of this (SQLite + local storage + in-process bus).
#
#   docker compose up -d
#
# then in backend/.env:
#   DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/intelliproctor
#   REDIS_URL=redis://localhost:6379/0
#   S3_ENDPOINT_URL=http://localhost:9000
#   S3_ACCESS_KEY=minioadmin
#   S3_SECRET_KEY=minioadmin
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intelliproctor
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
